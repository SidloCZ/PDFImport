<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Barva 1: Cerne zaoblene pozadi -->
  <rect width="128" height="128" rx="28" fill="#000000" />

  <!-- 1. SOUBOR (zmensena, elegantni ikona na leve strane, x: 14 az 42) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 40 C16 36 19 33 23 33 L34 33 L44 43 L44 87 C44 91 41 94 37 94 L23 94 C19 94 16 91 16 87 Z" />
    <path d="M34 33 L34 43 L44 43" />
