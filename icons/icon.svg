<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1F22" />
      <stop offset="100%" stop-color="#0F1012" />
    </linearGradient>
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#D32F2F" />
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E82EE" />
      <stop offset="50%" stop-color="#9B72CF" />
      <stop offset="100%" stop-color="#D96570" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- PDF Document symbol -->
  <g transform="translate(22, 20)">
    <!-- Document background with fold -->
    <path d="M8 4 C8 1.8 9.8 0 12 0 L46 0 L66 20 L66 84 C66 86.2 64.2 88 62 88 L12 88 C9.8 88 8 86.2 8 84 Z" fill="#2B2D31" stroke="#3F4248" stroke-width="2" />
    <!-- Fold triangle -->
    <path d="M46 0 L46 20 L66 20 Z" fill="#4B4E56" />

    <!-- Red PDF badge -->
    <rect x="0" y="44" width="48" height="22" rx="4" fill="url(#pdfGrad)" filter="url(#glow)" />
    <text x="24" y="60" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">PDF</text>
  </g>

  <!-- Gemini 4-point Sparkle Star -->
  <g transform="translate(68, 54)">
    <circle cx="26" cy="26" r="28" fill="#1A1C1E" opacity="0.8" />
    <!-- Outer glow sparkle -->
    <path d="M26 2 C26 15 37 26 50 26 C37 26 26 37 26 50 C26 37 15 26 2 26 C15 26 26 15 26 2 Z" fill="url(#geminiGrad)" filter="url(#glow)" />
    <!-- Center highlight -->
    <circle cx="26" cy="26" r="3" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
