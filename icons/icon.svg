    <!-- Hrot sipky a stredove telo -->
    <path d="M74 52 L88 64 L74 76 L74 70 L64 70 L64 58 L74 58 Z" />

    <!-- Trailing speed pruhy s mezerami -->
    <!-- Radek 1 -->
    <rect x="52" y="55" width="8" height="3.5" rx="1.75" />
    <!-- Radek 2 -->
    <rect x="47" y="60.5" width="12" height="3.5" rx="1.75" />
    <!-- Radek 3 -->
    <rect x="53" y="66" width="8" height="3.5" rx="1.75" />
    <!-- Radek 4 -->
    <rect x="48" y="71.5" width="10" height="3.5" rx="1.75" />
  </g>

  <!-- 3. AI SPARKLE (prava strana, stred x: 110, y: 64 - velkorysy odstup) -->
  <path d="M110 48 C110 57 114 64 122 64 C114 64 110 71 110 80 C110 71 106 64 98 64 C106 64 110 57 110 48 Z" fill="#FFFFFF" />
