<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Cerne zaoblene pozadi -->
  <rect width="128" height="128" rx="28" fill="#000000" />

  <!-- 1. SOUBOR (bily obrys, leva strana) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 38 C16 34 19 31 23 31 L34 31 L44 41 L44 89 C44 93 41 96 37 96 L23 96 C19 96 16 93 16 89 Z" />
    <path d="M34 31 L34 41 L44 41" />
    <line x1="23" y1="56" x2="34" y2="56" stroke-width="4.5" />
    <line x1="23" y1="70" x2="37" y2="70" stroke-width="4.5" />
  </g>

  <!-- 2. SPEED ARROW (barevna - elektricka cyan, stred) -->
  <g fill="#00D2FF">
    <!-- Hrot a stredove telo -->
    <path d="M72 50 L88 64 L72 78 L72 70 L60 70 L60 58 L72 58 Z" />

    <!-- Aerodynamicke motion pruhy s plynulym odsazenim -->
    <rect x="52" y="53" width="9" height="4" rx="2" />
    <rect x="46" y="62" width="12" height="4" rx="2" />
    <rect x="52" y="71" width="9" height="4" rx="2" />
  </g>

  <!-- 3. TEXT "AI" (ciste bily, prava strana) -->
  <text x="105" y="73" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', sans-serif" font-size="25" font-weight="900" text-anchor="middle" letter-spacing="-0.5">AI</text>
</svg>
